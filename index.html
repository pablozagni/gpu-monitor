<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPU Monitor — Ultron</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--bg:#0f0f11;--surface:#1a1a1f;--surface2:#222228;--border:#2e2e38;--text:#e8e8f0;--muted:#888899;--green:#1D9E75;--pink:#D4537E;--blue:#378ADD;--amber:#EF9F27;--red:#E24B4A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;padding:10px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
header h1{font-size:13px;font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;display:inline-block;margin-right:5px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ts{font-size:11px;color:var(--muted)}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:650px){#grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.ptitle{font-size:12px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.psub{font-size:11px;color:var(--muted)}
.badge{font-size:10px;padding:1px 7px;border-radius:99px;margin-right:5px}
.b0{background:#0F6E56;color:#9FE1CB}
.b1{background:#185FA5;color:#B5D4F4}
.cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-bottom:8px}
.card{background:var(--surface2);border-radius:7px;padding:6px 8px}
.cl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.cv{font-size:18px;font-weight:600;line-height:1}
.cu{font-size:11px;font-weight:400;color:var(--muted)}
.cs{font-size:10px;color:var(--muted);margin-top:2px}
.ok{color:var(--green)}.warn{color:var(--amber)}.hot{color:var(--red)}.blue{color:var(--blue)}.amber{color:var(--amber)}
.brow{margin-bottom:5px}
.bmeta{display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px;color:var(--muted)}
.bval{color:var(--text);font-weight:500}
.btrack{background:var(--surface2);border-radius:3px;height:6px;overflow:hidden}
.bfill{height:100%;border-radius:3px;transition:width .6s ease}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:7px 0}
.chwrap{position:relative;height:75px}
.stitle{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.ptable{width:100%;border-collapse:collapse}
.ptable th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:0 0 4px;border-bottom:1px solid var(--border)}
.ptable th:last-child,.ptable td:last-child{text-align:right}
.ptable td{padding:4px 0;border-bottom:1px solid var(--border);font-size:11px}
.ptable tr:last-child td{border-bottom:none}
.noproc{color:var(--muted);font-size:11px;text-align:center;padding:6px 0}
</style>
</head>
<body>
<header>
  <h1>GPU Monitor — Ultron</h1>
  <span class="ts"><span class="dot"></span><span id="ts">—</span></span>
</header>
<div id="grid"></div>

<script>
const MAX = 40;
const COLS = ['rgb(29,158,117)','rgb(55,138,221)'];
const BADGES = ['b0','b1'];
const charts = {};

function fmt(mb){ return mb>=1024?(mb/1024).toFixed(1)+' GB':mb+' MB' }
function tcls(t){ return t<60?'ok':t<75?'warn':'hot' }
function tlbl(t){ return t<60?'normal':t<75?'moderada':'alta' }

function mkChart(id, col, unit, cap100){
  const el = document.getElementById(id);
  if(!el) return null;
  const h = Array(MAX).fill(null);
  const c = new Chart(el,{
    type:'line',
    data:{labels:Array(MAX).fill(''),datasets:[{data:[...h],borderColor:col,
      backgroundColor:col.replace('rgb','rgba').replace(')',',0.1)'),
      borderWidth:1.5,fill:true,tension:0.4,pointRadius:0}]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:300},
      plugins:{legend:{display:false}},
      scales:{x:{display:false},y:{min:0,max:cap100?100:undefined,
        ticks:{color:'#888899',font:{size:10},callback:v=>v+unit,maxTicksLimit:3},
        grid:{color:'rgba(255,255,255,0.04)'}}}}
  });
  return {c,h};
}

function buildPanel(g, i){
  const grid = document.getElementById('grid');
  const d = document.createElement('div');
  d.className = 'panel';
  d.id = 'p'+i;
  d.innerHTML =
    '<div class="ptitle">'+
      '<span><span class="badge '+BADGES[i%2]+'">GPU '+i+'</span>'+g.name.replace('NVIDIA GeForce ','')+'</span>'+
      '<span class="psub" id="om'+i+'">'+g.mem_total+' MB</span>'+
    '</div>'+
    '<div class="cards">'+
      '<div class="card"><div class="cl">Temp</div><div class="cv"><span id="t'+i+'" class="ok">—</span><span class="cu">°C</span></div><div class="cs" id="ts'+i+'">—</div></div>'+
      '<div class="card"><div class="cl">GPU</div><div class="cv"><span id="u'+i+'" class="blue">—</span><span class="cu">%</span></div><div class="cs">util</div></div>'+
      '<div class="card"><div class="cl">Watts</div><div class="cv"><span id="w'+i+'" class="amber">—</span><span class="cu">W</span></div><div class="cs" id="wl'+i+'">—</div></div>'+
    '</div>'+
    '<div class="brow"><div class="bmeta"><span>VRAM usada</span><span class="bval" id="vu'+i+'">—</span></div><div class="btrack"><div class="bfill" id="bu'+i+'" style="background:var(--pink);width:0%"></div></div></div>'+
    '<div class="brow"><div class="bmeta"><span>VRAM libre</span><span class="bval" id="vf'+i+'">—</span></div><div class="btrack"><div class="bfill" id="bf'+i+'" style="background:var(--green);width:0%"></div></div></div>'+
    '<div class="charts">'+
      '<div><div class="stitle">GPU %</div><div class="chwrap"><canvas id="cu'+i+'"></canvas></div></div>'+
      '<div><div class="stitle">VRAM MB</div><div class="chwrap"><canvas id="cv'+i+'"></canvas></div></div>'+
    '</div>'+
    '<div class="stitle">Procesos</div><div id="pr'+i+'"><p class="noproc">Sin procesos</p></div>';
  grid.appendChild(d);
  const cu = mkChart('cu'+i, COLS[i%2], '%', true);
  const cv = mkChart('cv'+i, COLS[i%2], ' MB', false);
  charts[i] = {cu, cv};
}

function updPanel(g, i){
  const tel = document.getElementById('t'+i);
  const om=document.getElementById('om'+i); if(om) om.textContent=g.ollama_model||(g.mem_total+' MB');
  if(!tel) return;
  tel.textContent = g.temp; tel.className = tcls(g.temp);
  document.getElementById('ts'+i).textContent = tlbl(g.temp);
  document.getElementById('u'+i).textContent = g.util_gpu;
  document.getElementById('w'+i).textContent = g.power_draw.toFixed(0);
  document.getElementById('wl'+i).textContent = '/ '+g.power_limit.toFixed(0)+'W';
  const up = (g.mem_used/g.mem_total*100).toFixed(1);
  const fp = (g.mem_free/g.mem_total*100).toFixed(1);
  document.getElementById('vu'+i).textContent = fmt(g.mem_used);
  document.getElementById('vf'+i).textContent = fmt(g.mem_free);
  document.getElementById('bu'+i).style.width = up+'%';
  document.getElementById('bf'+i).style.width = fp+'%';
  const ch = charts[i];
  if(ch && ch.cu){ ch.cu.h.push(g.util_gpu); ch.cu.h.shift(); ch.cu.c.data.datasets[0].data=[...ch.cu.h]; ch.cu.c.update('none'); }
  if(ch && ch.cv){ ch.cv.h.push(g.mem_used); ch.cv.h.shift(); ch.cv.c.data.datasets[0].data=[...ch.cv.h]; ch.cv.c.update('none'); }
  const pr = document.getElementById('pr'+i);
  if(!g.processes.length){ pr.innerHTML='<p class="noproc">Sin procesos</p>'; return; }
  pr.innerHTML='<table class="ptable"><thead><tr><th>Proceso</th><th>PID</th><th>VRAM</th></tr></thead><tbody>'+
    g.processes.map(p=>'<tr><td>'+p.name.split('/').pop()+'</td><td style="color:var(--muted)">'+p.pid+'</td><td>'+fmt(p.mem_mb)+'</td></tr>').join('')+'</tbody></table>';
}

let ready = false;
async function refresh(){
  try{
    const gpus = await fetch('/api/gpu').then(r=>r.json());
    if(!ready){
      gpus.forEach((g,i) => buildPanel(g,i));
      ready = true;
    }
    gpus.forEach((g,i) => updPanel(g,i));
    document.getElementById('ts').textContent = new Date().toLocaleTimeString('es-AR');
  } catch(e){
    document.getElementById('ts').textContent = 'error';
  }
}
refresh();
setInterval(refresh,3000);
</script>
</body>
</html>
