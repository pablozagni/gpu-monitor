services:
  gpu-monitor:
    build: .
    runtime: nvidia
    container_name: gpu-monitor
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

